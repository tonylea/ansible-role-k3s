- name: Verify both nodes
  hosts: all
  become: true
  tasks:
    - name: Read the kernel command line
      ansible.builtin.slurp:
        src: /boot/firmware/cmdline.txt
      register: cmdline

    - name: The memory cgroup is turned on, once, at the end of the line
      ansible.builtin.assert:
        that:
          - (cmdline.content | b64decode).endswith('rpi-imager-1794139163251 cgroup_memory=1 cgroup_enable=memory\n')
          - (cmdline.content | b64decode).count('cgroup_enable=memory') == 1
        fail_msg: "The command line: {{ cmdline.content | b64decode }}"

    - name: Run conntrack
      ansible.builtin.command: conntrack --version
      changed_when: false

    - name: Read the forwarding and bridge settings
      ansible.builtin.command: sysctl -n net.ipv4.ip_forward net.bridge.bridge-nf-call-iptables net.bridge.bridge-nf-call-ip6tables
      register: sysctls
      changed_when: false

    - name: Forwarding and bridged traffic filtering are on
      ansible.builtin.assert:
        that: sysctls.stdout_lines == ['1', '1', '1']

    - name: Read the config's permissions
      ansible.builtin.stat:
        path: /etc/rancher/k3s/config.yaml
      register: config_file

    - name: Only root can read the config
      ansible.builtin.assert:
        that: config_file.stat.mode == '0600'

    - name: List the firewall rules
      ansible.builtin.command: ufw show added
      register: ufw_rules
      changed_when: false

    - name: The nodes and pods are allowed in
      ansible.builtin.assert:
        that:
          - "'ufw allow from 172.30.0.10 to any port 10250 proto tcp' in ufw_rules.stdout"
          - "'ufw allow from 172.30.0.11 to any port 8472 proto udp' in ufw_rules.stdout"
          - "'ufw allow from 172.30.0.10 to any port 7946' in ufw_rules.stdout"
          - "'ufw allow from 172.30.0.10 to any port 9100 proto tcp' in ufw_rules.stdout"
          - "'ufw allow from 172.30.0.11 to any port 9120 proto tcp' in ufw_rules.stdout"
          - "'ufw route allow from 10.42.0.0/16' in ufw_rules.stdout"
          - "'ufw route allow to 10.43.0.0/16' in ufw_rules.stdout"
          - "'ufw allow from 10.42.0.0/16' in ufw_rules.stdout"

- name: Verify the server
  hosts: server
  become: true
  tasks:
    - name: Wait for both nodes to be Ready
      ansible.builtin.command: k3s kubectl get nodes --no-headers
      register: nodes
      until: nodes.stdout_lines | select('search', ' Ready ') | list | length == 2
      retries: 30
      delay: 10
      changed_when: false

    - name: Read the server's config
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/config.yaml
      register: server_config

    - name: The bundled ingress, load balancer and storage are off, and secrets are encrypted
      ansible.builtin.assert:
        that:
          - (server_config.content | b64decode | from_yaml).disable == ['traefik', 'servicelb', 'local-storage']
          - (server_config.content | b64decode | from_yaml)['secrets-encryption']

    - name: List the firewall rules
      ansible.builtin.command: ufw show added
      register: ufw_rules
      changed_when: false

    - name: The Kubernetes API is open to the API sources
      ansible.builtin.assert:
        that: "'ufw allow from 172.30.0.0/24 to any port 6443 proto tcp' in ufw_rules.stdout"

    - name: Read the agent's node
      ansible.builtin.command: k3s kubectl get node {{ hostvars['agent']['ansible_facts']['nodename'] }} -o json
      register: agent_node
      changed_when: false

    - name: The agent is labelled as a worker
      ansible.builtin.assert:
        that: (agent_node.stdout | from_json).metadata.labels['node-role.kubernetes.io/worker'] == 'true'

    - name: The agent registered with its own label
      ansible.builtin.assert:
        that: (agent_node.stdout | from_json).metadata.labels['example.com/test'] | default('') == 'true'

    - name: Read the cluster DNS service's address
      ansible.builtin.command: k3s kubectl --namespace kube-system get service kube-dns --output jsonpath={.spec.clusterIP}
      register: dns_address
      changed_when: false

    - name: Cluster DNS is at the set address
      ansible.builtin.assert:
        that: dns_address.stdout == '10.43.0.10'

    - name: Read the names on the API certificate
      ansible.builtin.command: openssl x509 -noout -ext subjectAltName -in /var/lib/rancher/k3s/server/tls/serving-kube-apiserver.crt
      register: api_cert
      changed_when: false

    - name: The API certificate carries the extra name
      ansible.builtin.assert:
        that: "'DNS:k8s.example.internal' in api_cert.stdout"

    - name: Read the server's node
      ansible.builtin.command: k3s kubectl get node {{ ansible_facts['nodename'] }} -o json
      register: server_node
      changed_when: false

    - name: The server is tainted so ordinary workloads stay off it
      ansible.builtin.assert:
        that: >-
          (server_node.stdout | from_json).spec.taints
          | selectattr('key', 'equalto', 'node-role.kubernetes.io/control-plane')
          | selectattr('effect', 'equalto', 'NoSchedule') | list | length == 1

- name: Verify the agent
  hosts: agent
  become: true
  tasks:
    - name: List the firewall rules
      ansible.builtin.command: ufw show added
      register: ufw_rules
      changed_when: false

    - name: The Kubernetes API isn't opened on an agent
      ansible.builtin.assert:
        that: "'6443' not in ufw_rules.stdout"
