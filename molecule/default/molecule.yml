dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml

driver:
  name: docker

# A server and an agent on their own network. systemd runs as PID 1 so k3s runs as a service, and
# /var/lib/rancher is a volume because containerd can't stack its overlay filesystem on the container's.
platforms:
  - name: server
    image: debian:trixie-20261104
    dockerfile: Dockerfile.j2
    pre_build_image: false
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /lib/modules:/lib/modules:ro
      - /var/lib/rancher
    tmpfs:
      - /run
      - /tmp
    docker_networks:
      - name: k3s
        ipam_config:
          - subnet: 172.30.0.0/24
    networks:
      - name: k3s
        ipv4_address: 172.30.0.10
  - name: agent
    image: debian:trixie-20261104
    dockerfile: Dockerfile.j2
    pre_build_image: false
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /lib/modules:/lib/modules:ro
      - /var/lib/rancher
    tmpfs:
      - /run
      - /tmp
    networks:
      - name: k3s
        ipv4_address: 172.30.0.11

provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        k3s_api_sources:
          - 172.30.0.0/24
        k3s_node_sources:
          - 172.30.0.10
          - 172.30.0.11
    host_vars:
      server:
        k3s_role: server
        k3s_tls_san_extra:
          - k8s.example.internal
      agent:
        k3s_role: agent
        k3s_server: server

verifier:
  name: ansible
